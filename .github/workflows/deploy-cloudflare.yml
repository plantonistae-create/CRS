name: Deploy CRS to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Smoke test production
        run: |
          set -euo pipefail
          BASE='https://chamador-crs-coophavila.crs-coophavila.workers.dev'

          # Allow a short propagation window after the deploy.
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 20 "$BASE/api/health" -o /tmp/health.json; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo 'Health endpoint did not become available.' >&2
              exit 1
            fi
            sleep 3
          done

          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/health.json','utf8')); if(!x.ok || x.storage!=='durable-object-sqlite' || x.realtime!=='websocket') process.exit(1); console.log('health ok:', x);"

          curl --fail --silent --show-error --max-time 20 "$BASE/" -o /tmp/index.html
          grep -q 'CRS Coophavila · Central Assistencial' /tmp/index.html
          grep -q 'Censo' /tmp/index.html
          grep -q 'Reavaliações' /tmp/index.html
          grep -q 'Prescrição' /tmp/index.html
          grep -q 'Chamador' /tmp/index.html

          status=$(curl --silent --output /tmp/session.json --write-out '%{http_code}' --max-time 20 "$BASE/api/auth/session")
          test "$status" = '401'
          echo 'production smoke test passed'
